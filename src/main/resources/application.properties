spring.application.name=mission-extremis
server.port=8080

# --- Persistance ---
# Profil par defaut : PostgreSQL embarque (binaires Zonky, aucun Docker requis).
spring.datasource.url=jdbc:postgresql://localhost:5433/extremis?user=extremis&password=extremis&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Migration des anciens noms de competences ---
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Mode debug ---
# extremis.debug=true : affiche le bouton de reinitialisation usine dans la console et d'autres infos debug
extremis.debug=false

# --- Wiki Notion (onglet "Extremis") ---
# Jeton d'integration interne Notion (secret) : a renseigner en local ou via variable d'environnement.
extremis.wiki.notion-token=${NOTION_WIKI_TOKEN:}
# URL de base de l'API Notion (surchargable pour les tests).
extremis.wiki.notion-base-url=https://api.notion.com/v1
